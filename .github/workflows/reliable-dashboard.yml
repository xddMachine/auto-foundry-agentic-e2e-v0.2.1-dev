name: Reliable analytics and dashboard acceptance
on:
  push:
    branches: [feat/reliable-analytics-dashboard]
  pull_request:
    branches: [feat/agentic-e2e-v0.2.1-core-v0.1]
permissions:
  contents: read
concurrency:
  group: reliable-dashboard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            src
            skills
            apps
            scripts
            tests
            benchmarks
            docs
            pyproject.toml
            README.md
            AGENTS.md
            .github
            .gitignore
          sparse-checkout-cone-mode: false
      - name: Record exact source under test, without business runs or credentials
        run: |
          mkdir -p validation
          git rev-parse HEAD > validation/source-sha.txt
          python --version > validation/python-version.txt
          node --version > validation/node-version.txt
          tar -czf validation/source.tar.gz src skills apps scripts tests benchmarks docs pyproject.toml README.md AGENTS.md .github .gitignore
      - name: Install project and validation dependencies (no model credentials)
        run: |
          python -m pip install -e . pytest wheel setuptools playwright
          python -m pip freeze > validation/dependencies.txt
      - name: Package the paired core and skill release
        run: python scripts/package_release.py > validation/package.json
      - name: Validate release bytes, wheel contents and offline installation
        run: python scripts/validate_release.py > validation/release-validation.json
      - name: Complete deterministic core, integration and skill suite
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=validation/pytest.xml 2>&1 | tee validation/pytest.log
      - name: Control Center Python suite
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python -m unittest discover -s apps/control_center_operational/tests -p 'test_*.py' 2>&1 | tee validation/control-center.log
      - name: Control Center JavaScript contracts
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node --test apps/control_center_operational/tests/test_*.js 2>&1 | tee validation/javascript.log
      - name: Install test browser
        if: ${{ !cancelled() }}
        run: python -m playwright install --with-deps chromium
      - name: Real HTTP-served dashboard, interactions, evidence pages and mobile layout
        if: ${{ !cancelled() }}
        run: python scripts/validate_dashboard_browser.py --output validation/browser > validation/browser.log
      - name: Upload source, verification evidence and synthetic dashboard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-dashboard-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            validation/
            dist/*.zip
            dist/*.whl
          retention-days: 7
          if-no-files-found: error
