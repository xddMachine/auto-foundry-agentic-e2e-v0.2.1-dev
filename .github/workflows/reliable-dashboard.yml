name: Reliable dashboard offline validation
on:
  push:
    branches: [feat/reliable-analytics-dashboard]
  pull_request:
    branches: [feat/agentic-e2e-v0.2.1-core-v0.1]
permissions:
  contents: read
concurrency:
  group: reliable-dashboard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            skills
            apps
            scripts
            tests
            benchmarks
            docs
            pyproject.toml
            README.md
          sparse-checkout-cone-mode: false
      - name: Archive the exact source under test (no run data or credentials)
        run: |
          mkdir -p validation
          git rev-parse HEAD > validation/source-sha.txt
          tar -czf validation/source.tar.gz src skills apps scripts tests benchmarks docs pyproject.toml README.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-under-test
          path: validation/source*
          retention-days: 7
      - name: Install existing project dependencies
        run: python -m pip install -e . pytest
      - name: Offline tests (no model credentials, calls or business runs)
        env:
          PYTHONPATH: src
        run: python -m pytest -q --junitxml=validation/pytest.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-test-results
          path: validation/pytest.xml
          retention-days: 7
