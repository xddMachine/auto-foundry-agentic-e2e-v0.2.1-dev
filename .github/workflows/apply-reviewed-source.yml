name: Apply reviewed source transaction
on:
  push:
    branches: [feat/reliable-analytics-dashboard]
    paths: [.github/workflows/apply-reviewed-source.yml]
permissions:
  contents: write
concurrency:
  group: apply-reviewed-source
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          sparse-checkout: |
            src
            skills
            apps
            scripts
            tests
            benchmarks
            docs
            pyproject.toml
            README.md
            AGENTS.md
            .github
            .gitignore
          sparse-checkout-cone-mode: false
      - name: Apply exact reviewed byte edits with before and after checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          root = pathlib.Path.cwd()
          ids = ['f7a16dcf6183ae44858e94e079d1dca737206ac9','0f3220d3284f0bf5e8a00befb58eec157aa3b97b','a9e6756e32e401526deefa111cd4dc78644901f3','3c2926135d0421e426bb3a2f8a1cbac3a353f4e5','e548a7af22437e3e15063d89061d10e54a9b4f9f']
          chunks = []
          for sha in ids:
              req = urllib.request.Request('https://api.github.com/repos/xddMachine/auto-foundry-agentic-e2e-v0.2.1-dev/git/blobs/'+sha, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'reviewed-source-transaction'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = json.load(response)
              data = base64.b64decode(payload['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == sha
              chunks.append(data)
          raw = lzma.decompress(base64.b64decode(b''.join(chunks), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '608b857531e62be2216393f3261b2c9fecc83065553543d2e8d505c83da22c0a'
          overlay = ''
          followup = lzma.decompress(base64.b64decode(overlay,validate=True))
          assert hashlib.sha256(followup).hexdigest() == 'f93234e6aa9deb5871404d4f5bec068fa294e70f8f7b00cf79e54857c95bd2e3'
          pending = {}
          for entry in [*json.loads(raw), *json.loads(followup)]:
              name = entry['path']; rel = pathlib.PurePosixPath(name)
              assert not rel.is_absolute() and '..' not in rel.parts and '\\' not in name
              assert rel.parts[0] in {'src','skills','apps','scripts','tests','benchmarks','docs','AGENTS.md','README.md','pyproject.toml'}
              path = root / rel
              assert not path.is_symlink() and all(not p.is_symlink() for p in path.parents)
              old = pending[name][0] if name in pending else path.read_bytes() if path.is_file() else b''
              if entry['before_sha256'] is None:
                  assert not path.exists(), name
              else:
                  assert hashlib.sha256(old).hexdigest() == entry['before_sha256'], 'source changed: '+name
              end = -1
              for start, stop, value in entry['edits']:
                  assert 0 <= start <= stop <= len(old) and start >= end
                  end = stop
              for start, stop, value in reversed(entry['edits']):
                  old = old[:start] + value.encode('utf-8') + old[stop:]
              assert hashlib.sha256(old).hexdigest() == entry['after_sha256'], 'output mismatch: '+name
              mode = int(entry['mode'],8); assert mode in (0o644,0o755)
              pending[name] = (old,mode)
          assert len(pending) == 48
          for name,(data,mode) in pending.items():
              path=root/name; path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(data); path.chmod(mode)
          subprocess.run(['git','add','--',*sorted(pending)],check=True)
          print('Validated and staged',len(pending),'source/test/documentation files; runs untouched')
          PY
      - name: Check source syntax and publish only to the requested feature branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 -m compileall -q src skills/auto-foundry-agentic-e2e/scripts apps/control_center_operational scripts tests
          git diff --cached --check
          remote_head=$(git ls-remote origin refs/heads/feat/reliable-analytics-dashboard | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name 'Auto Foundry development'
          git config user.email '148481963+xddMachine@users.noreply.github.com'
          git commit -m 'fix: reliable accepted analytics handoff and reviewed dashboards'
          git push origin HEAD:refs/heads/feat/reliable-analytics-dashboard
          git rev-parse HEAD
